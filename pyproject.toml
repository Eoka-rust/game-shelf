[project]
name = "game-shelf"
version = "1.2.2"
description = "Полка игр — мини-сервис на FastAPI + PostgreSQL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary]",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) в аргументах — штатный способ FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
