<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полка игр</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Полка игр</h1>
      <p class="page__subtitle">Что пройдено, что в процессе, что ждёт своей очереди</p>
    </div>
    <div class="version" id="version">версия …</div>
  </header>

  <form id="add-form" class="add-form" autocomplete="off">
    <input id="title" class="field field--wide" name="title"
           placeholder="Название игры" required maxlength="200">
    <input id="platform" class="field" name="platform"
           placeholder="Платформа" required maxlength="50">
    <select id="status" class="field" name="status">
      <option value="backlog">В очереди</option>
      <option value="playing">Играю</option>
      <option value="completed">Пройдена</option>
    </select>
    <select id="rating" class="field" name="rating">
      <option value="">Без оценки</option>
      <option value="10">10</option>
      <option value="9">9</option>
      <option value="8">8</option>
      <option value="7">7</option>
      <option value="6">6</option>
      <option value="5">5</option>
      <option value="4">4</option>
      <option value="3">3</option>
      <option value="2">2</option>
      <option value="1">1</option>
    </select>
    <button type="submit" class="btn btn--primary">Добавить</button>
  </form>

  <ul id="list" class="games"></ul>
  <p class="empty" id="empty" hidden>Пока пусто — добавьте первую игру</p>
</main>

<script>
const STATUS_LABELS = {
  backlog: "В очереди",
  playing: "Играю",
  completed: "Пройдена",
};

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");

async function loadVersion() {
  try {
    const data = await fetch("/version").then((r) => r.json());
    document.getElementById("version").textContent = "версия " + data.version;
  } catch {
    document.getElementById("version").textContent = "версия недоступна";
  }
}

function render(game) {
  const li = document.createElement("li");
  li.className = "game";

  const info = document.createElement("div");
  info.className = "game__info";
  const title = document.createElement("div");
  title.className = "game__title";
  title.textContent = game.title;
  const meta = document.createElement("div");
  meta.className = "game__meta";
  meta.textContent = game.rating ? `${game.platform} · оценка ${game.rating}/10` : game.platform;
  info.append(title, meta);

  const select = document.createElement("select");
  select.className = "field";
  for (const [value, label] of Object.entries(STATUS_LABELS)) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    option.selected = value === game.status;
    select.append(option);
  }
  select.addEventListener("change", async (event) => {
    await fetch(`/games/${game.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: event.target.value }),
    });
    loadGames();
  });

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "btn btn--danger";
  remove.textContent = "Удалить";
  remove.addEventListener("click", async () => {
    if (!confirm(`Удалить «${game.title}»?`)) return;
    await fetch(`/games/${game.id}`, { method: "DELETE" });
    loadGames();
  });

  const controls = document.createElement("div");
  controls.className = "game__controls";
  controls.append(select, remove);

  li.append(info, controls);
  return li;
}

async function loadGames() {
  const games = await fetch("/games").then((r) => r.json());
  listEl.replaceChildren(...games.map(render));
  emptyEl.hidden = games.length > 0;
}

document.getElementById("add-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const payload = {
    title: document.getElementById("title").value,
    platform: document.getElementById("platform").value,
    status: document.getElementById("status").value,
    rating: document.getElementById("rating").value
      ? Number(document.getElementById("rating").value)
      : null,
  };
  await fetch("/games", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  event.target.reset();
  loadGames();
});

loadVersion();
loadGames();
</script>
</body>
</html>
