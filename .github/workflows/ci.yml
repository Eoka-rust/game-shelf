name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Линтер и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gameshelf
          POSTGRES_PASSWORD: gameshelf
          POSTGRES_DB: gameshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameshelf -d gameshelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gameshelf:gameshelf@localhost:5432/gameshelf_test
      TEST_DATABASE_URL: postgresql://gameshelf:gameshelf@localhost:5432/gameshelf_test

    steps:
      - uses: actions/checkout@v4

      - name: Установить uv и Python из .python-version
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Установить зависимости строго по uv.lock
        run: uv sync --frozen

      - name: Ruff — линтер
        run: uv run ruff check .

      - name: Ruff — форматирование
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  build:
    name: Образ в ghcr.io
    runs-on: ubuntu-latest
    needs: check

    # Публикуем только после зелёного check и только из main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Сборка и пуш
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
